<!DOCTYPE html>
<html lang="es"> <!-- idioma  -->
<HEAD>
    <meta charset="UTF-8"> <!--permite usar caracteres especiales-->
    <!--Conecta este archivo HTML con el archivo css-->
    <link rel="stylesheet" href="style.css">
    <link rel ="stylesheet" href="inversiones.css">
    <link rel ="stylesheet" href="reservas.css">
    <link rel ="stylesheet" href="productos.css">
</HEAD>
<body>
    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                📦 Inventario 
            </div>

            <nav>
                <ul>
                    <li>
                        <a href="index.html">
                            🏠 Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="productos.html">
                            📦 Productos
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            📅 Reservas
                        </a>
                    </li>
                    <li>
                        <a href="inversiones.html">
                            💰 Inversiones
                        </a>
                    </li>
                    <li>📊 Reportes</li>
                    <li>⚙ Configuración</li>
                </ul>
            </nav>

        </aside>
        <main class="contenido">
            <header class="navbar">
                <h2>

                    📦 Productos

                </h2>

                <button class="btn-nuevo">

                    + Nuevo Producto

                </button>
            </header>
            <section class="dashboard">
                <div class="card">
                    <h3>
                        📦 Total Productos
                    </h3>
                    <p id="total-productos">
                        0
                    </p>
                </div>

                <div class="card">
                    <h3>
                        📚 Stock Total
                    </h3>

                    <p id="stock-total">
                        0
                    </p>
                </div>

                <div class ="card">
                    <h3>
                        🟠 Poco Stock
                    </h3>

                    <p id="poco-stock">
                        0
                    </p>
                </div>

                <div class ="card">
                    <h3>
                         🔴 Sin Stock
                    </h3>

                    <p id="sin-stock">
                        0
                    </p>
                </div>
            </section>

            <section class="tabla-container">

                <h3>
                    Productos
                </h3>

                <table>

                    <thead>

                        <tr>

                            <th>Producto</th>

                            <th>Categoría</th>

                            <th>cantidad</th>

                            <th>Compra</th>

                            <th>Venta</th>

                            <th>Estado</th> 

                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tabla-productos">

                    </tbody>

                </table>

            </section>
        </main>

        <div id="modal-producto" class="modal">
            <div class="modal-content">

                <h3>   
                    Nuevo Producto
                </h3>

                <input
                    id="nombre"
                    placeholder="Nombre del producto"
                >

                <input
                    id="categoria"
                    placeholder="Categoría"  
                >

                <input
                    id="cantidad"
                    type="number"
                    placeholder="Stock"  
                >

                <input
                    id="compra"
                    type="number"
                    placeholder="Precio Compra"  
                >

                <input
                    id="venta"
                    type="number"
                    placeholder="Precio Venta"  
                >

                <button id="guardar-producto">
                    Guardar
                </button>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="productos.js"></script>
</body>
</html>
