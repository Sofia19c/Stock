<!DOCTYPE html>
<html lang="es"> <!-- idioma  -->
<HEAD>
    <meta charset="UTF-8"> <!--permite usar caracteres especiales-->
    <!--Conecta este archivo HTML con el archivo css-->
    <link rel="stylesheet" href="css/style.css">
    <link rel ="stylesheet" href="css/inversiones.css">
    <link rel ="stylesheet" href="css/reservas.css">
    <link rel ="stylesheet" href="css/productos.css">
    <link rel="stylesheet" href="css/darkmode.css">
</HEAD>
<body>
    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                📦 Inventario 
            </div>

            <nav>
                <ul>
                    <li>
                        <a href="index.html">
                            🏠 Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="productos.html">
                            📦 Productos
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            📅 Reservas
                        </a>
                    </li>
                    <li>
                        <a href="inversiones.html">
                            💰 Inversiones
                        </a>
                    </li>
                    <li>
                        <a href="reportes.html">
                            📊 Reportes
                        </a>
                    </li>
                     <li>
                        <a href="configuracion.html">
                            ⚙ Configuración
                        </a>
                    </li>
                </ul>
            </nav>

        </aside>
        <main class="contenido">
            <header class="navbar">
                <h2>

                    📦 Productos

                </h2>

                <button class="btn-nuevo">

                    + Nuevo Producto

                </button>
            </header>
            <section class="dashboard">
                <div class="card">
                    <h3>
                        📦 Total Productos
                    </h3>
                    <p id="total-productos">
                        0
                    </p>
                </div>

                <div class="card">
                    <h3>
                        📚 Stock Total
                    </h3>

                    <p id="stock-total">
                        0
                    </p>
                </div>

                <div class ="card">
                    <h3>
                        🟠 Poco Stock
                    </h3>

                    <p id="poco-stock">
                        0
                    </p>
                </div>

                <div class ="card">
                    <h3>
                         🔴 Sin Stock
                    </h3>

                    <p id="sin-stock">
                        0
                    </p>
                </div>
            </section>

            <section>
                <div class="panel_productos">
                    <input
                        type="text"
                        id="busqueda"
                        placeholder="🔍 Buscar producto..."
                        >
                    <select id="filtro-categoria">

                        <option value="">
                            📦 Todas las categorías
                        </option>
                        <option value="CarPlay">
                            🚗 CarPlay
                        </option>
                        <option value="Cojines">
                            🪑 Cojines
                        </option>
                        <option value="Intercomunicadores">
                            🎧 Intercomunicadores
                        </option>
                        <option value="Otros">
                            📦 Otros
                        </option>
                    </select>
                </div>
            </section>

            <section>
                <div class="contenedor-tabla">
                    <div class="barra-herramientas">

                    </div>
                    <table>

                        <thead>

                            <tr>

                                <th>Producto</th>

                                <th>Categoría</th>

                                <th>cantidad</th>

                                <th>Compra</th>

                                <th>Venta</th>

                                <th>Vendidos</th>

                                <th>Estado</th> 

                                <th>Acciones</th>

                            </tr>

                        </thead>

                        <tbody id="tabla-productos">

                        </tbody>

                    </table>
                </div>
            </section>
        </main>

        <div id="modal-producto" class="modal">
            <div class="modal-content">

                <h3>   
                    Nuevo Producto
                </h3>

                <input
                    id="nombre"
                    placeholder="Nombre del producto"
                >

                <input
                    id="categoria"
                    placeholder="Categoría"  
                >

                <input
                    id="cantidad"
                    type="number"
                    placeholder="Stock"  
                >

                <input
                    id="compra"
                    type="number"
                    placeholder="Precio Compra"  
                >

                <input
                    id="venta"
                    type="number"
                    placeholder="Precio Venta"  
                >
                <button id="guardar-producto">
                    Guardar
                </button>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/tema.js"></script>
    <div id="toast"></div>
</body>
</html>
