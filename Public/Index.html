<!DOCTYPE html>
<html lang="es"> <!-- idioma  -->
<HEAD>
    <meta charset="UTF-8"> <!--permite usar caracteres especiales-->
    <title>INVENTARIO</title>
    <link rel ="stylesheet" href="style.css">
</HEAD>
<body>
    <!-- Esta seccion de codigo muestra 3 tarjetas con estadisticas de los productos-->
    <div class="layout">

    <aside class="sidebar">

        <div class="logo">
            📦 Inventario
        </div>

        <nav>
            <ul>
                <li class="activo">🏠 Dashboard</li>
                <li>📦 Productos</li>
                <li>📂 Categorías</li>
                <li>📥 Entradas</li>
                <li>📤 Salidas</li>
                <li>📊 Reportes</li>
                <li>⚙ Configuración</li>
            </ul>
        </nav>

    </aside>

    <main class="contenido">

        <header class="navbar">

            <h2>Dashboard</h2>

            <input
                type="text"
                id="busqueda"
                placeholder="Buscar producto..."
            >

        </header>

        <section class="dashboard">

            <div class="card">
                <h3>Total Productos</h3>
                <p id="total-productos">0</p>
            </div>

            <div class="card">
                <h3>Poco Stock</h3>
                <p id="stock-bajo-total">0</p>
            </div>

            <div class="card">
                <h3>Valor Inventario</h3>
                <p id="valor-total">$0</p>
            </div>

        </section>

        <section class="paneles">

            <div class="panel">

                <h3>Nuevo Producto</h3>

                <div class="formulario">

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Nombre producto"
                    >

                    <input
                        type="number"
                        id="cantidad"
                        placeholder="Cantidad"
                    >

                    <input
                        type="number"
                        id="precio"
                        placeholder="Precio"
                    >

                    <button id="btn-agregar">
                        Agregar Producto
                    </button>

                </div>

            </div>

        </section>

        <button id="btn-excel">
            📥 Exportar Excel
        </button>

        <section class="tabla-container">

            <table>

                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tabla-productos"></tbody>

            </table>

        </section>

    </main>

</div>
<script src="script.js"></script>
</body>
</html>
